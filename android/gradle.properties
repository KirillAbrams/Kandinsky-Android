# Ограничивает память и число рабочих потоков сборки. Включает единые настройки
# исходников и отдельные проверки для конфигураций выпуска.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official

# Проверяем отдельно обе сборки для выпуска.
android.onlyEnableUnitTestForTheTestedBuildType=false
